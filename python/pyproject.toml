[project]
name = "pidsim"
version = "0.1.0"
description = "Motor de referência em Python do VisualPID (simulador de controlador PID)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=2.0", "scipy", "matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pidsim"]
